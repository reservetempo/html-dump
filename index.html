<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>html-dump</title>
  <meta name="description" content="A place to try out new ideas, one HTML page at a time.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231b1a17'/><rect x='9' y='20' width='14' height='4' fill='%23d94a22'/></svg>">
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1b1a17;
      --muted: #6f6a60;
      --line: #dcd6ca;
      --hover: #ebe6dc;
      --accent: #d94a22;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131311;
        --ink: #ece8df;
        --muted: #8e897e;
        --line: #2b2a26;
        --hover: #1d1c19;
        --accent: #ff7a50;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 var(--mono);
    }
    main {
      max-width: 780px;
      margin: 0 auto;
      padding: 72px 16px 48px;
    }
    a { color: inherit; }

    header h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 56px);
      line-height: 1;
      letter-spacing: -0.04em;
      font-weight: 700;
    }
    .cursor {
      display: inline-block;
      width: 0.5em;
      height: 0.09em;
      margin-left: 0.06em;
      background: var(--accent);
      vertical-align: baseline;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

    header p {
      margin: 18px 0 0;
      color: var(--muted);
      max-width: 52ch;
    }

    .bar {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 48px 0 8px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    .bar .count { white-space: nowrap; }
    .bar label { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .bar input {
      width: 180px;
      max-width: 40vw;
      padding: 4px 8px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      color: var(--ink);
      font: inherit;
    }
    .bar input:focus { outline: none; border-color: var(--accent); }
    kbd {
      padding: 0 5px;
      border: 1px solid var(--line);
      border-radius: 3px;
      font: inherit;
      font-size: 11px;
    }

    ol { list-style: none; margin: 0; padding: 0; }
    li a {
      display: grid;
      grid-template-columns: 3.5ch 10.5ch 1fr;
      column-gap: 20px;
      padding: 14px 10px;
      margin: 0 -10px;
      border-radius: 6px;
      text-decoration: none;
    }
    li a:hover, li a:focus-visible { background: var(--hover); outline: none; }
    .num, time { color: var(--muted); font-size: 13px; padding-top: 2px; }
    .title { font-weight: 600; }
    li a:hover .title, li a:focus-visible .title { color: var(--accent); }
    .title::after {
      content: " \2192";
      opacity: 0;
      transition: opacity 0.15s;
    }
    li a:hover .title::after, li a:focus-visible .title::after { opacity: 1; }
    .desc {
      grid-column: 3;
      color: var(--muted);
      font-size: 13.5px;
    }

    .empty, .nomatch { display: none; padding: 28px 0; color: var(--muted); }
    ol:not(:has(li)) ~ .empty { display: block; }
    body:not(:has(#ideas li)) .bar label { display: none; }

    footer {
      margin-top: 64px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
    }
    footer a { text-decoration-color: var(--line); text-underline-offset: 3px; }
    footer a:hover { color: var(--accent); text-decoration-color: currentColor; }

    @media (max-width: 560px) {
      main { padding-top: 48px; }
      li a { grid-template-columns: 3.5ch 1fr; column-gap: 14px; }
      time { grid-column: 2; grid-row: 1; }
      .title, .desc { grid-column: 2; }
      .bar input { width: 120px; }
      .bar kbd { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>html-dump<span class="cursor" aria-hidden="true"></span></h1>
      <p>A place to try out new ideas. Each one gets its own page, built from scratch.</p>
    </header>

    <div class="bar">
      <span class="count"><!--COUNT--></span>
      <label>
        <input type="search" id="filter" placeholder="filter" aria-label="Filter ideas" autocomplete="off">
        <kbd>/</kbd>
      </label>
    </div>

    <ol id="ideas">
<!--IDEAS-->
    </ol>
    <p class="empty">Nothing here yet. The first idea is on its way.</p>
    <p class="nomatch" id="nomatch">No ideas match that.</p>

    <footer>
      <a href="https://github.com/reservetempo/html-dump">source on github</a>
    </footer>
  </main>

  <script>
    const input = document.getElementById("filter");
    const items = [...document.querySelectorAll("#ideas li")];
    const nomatch = document.getElementById("nomatch");

    input.addEventListener("input", () => {
      const q = input.value.trim().toLowerCase();
      let shown = 0;
      for (const li of items) {
        const hit = li.textContent.toLowerCase().includes(q);
        li.hidden = !hit;
        if (hit) shown++;
      }
      nomatch.style.display = items.length && !shown ? "block" : "none";
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
      } else if (e.key === "Escape" && document.activeElement === input) {
        input.value = "";
        input.dispatchEvent(new Event("input"));
        input.blur();
      }
    });
  </script>
</body>
</html>
